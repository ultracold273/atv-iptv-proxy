[package]
name = "atv-iptv-proxy"
version = "0.2.1"
edition = "2021"
description = "LAN-only IPTV authentication and channel proxy for the ATV client"
license = "MIT"
repository = "https://github.com/ultracold273/atv-iptv-proxy"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ureq = { version = "2.12", default-features = false }
encoding_rs = "0.8"
des = "0.8"
ecb = { version = "0.1", features = ["alloc", "block-padding"] }

[dev-dependencies]
